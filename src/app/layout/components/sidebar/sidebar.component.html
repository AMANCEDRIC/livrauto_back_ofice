<div [ngClass]="isCollapsed ? 'w-20' : 'w-64'" class="h-full bg-white flex flex-col z-20 transition-all duration-300 whitespace-nowrap border-r border-border shadow-sm">
  
  <!-- Logo Area -->
  <div class="flex items-center justify-center h-16 px-6 shrink-0">
    <div class="flex items-center justify-center w-full">
      <img src="/logo_livre_auto.png" alt="Livre Auto" class="h-10 w-auto object-contain">
    </div>
  </div>

  <!-- Navigation -->
  <div class="flex-1 overflow-y-auto py-6 px-0 overflow-x-hidden space-y-3">
    
    <ng-container *ngFor="let item of menuItems">
      <a [routerLink]="item.route" 
         routerLinkActive="bg-primary/5 text-primary border-primary font-semibold" 
         #rla="routerLinkActive"
         [routerLinkActiveOptions]="{exact: item.exact || false}"
         [title]="isCollapsed ? item.label : ''"
         [ngClass]="[
           isCollapsed ? 'justify-center px-0 mx-2 rounded-lg' : 'px-4 mx-4 rounded-r-lg',
           !rla.isActive ? 'border-transparent text-on-surface-variant hover:bg-surface-container hover:text-on-surface hover:translate-x-1 font-medium' : ''
         ]"
         class="group flex items-center h-11 transition-all duration-300 cursor-pointer border-l-[3px]">
        
        <lucide-icon [name]="item.icon" [size]="18" [strokeWidth]="rla.isActive ? 2.5 : 2"
                     class="transition-colors shrink-0" 
                     [ngClass]="rla.isActive ? 'text-primary' : 'text-on-surface-variant group-hover:text-on-surface'"
                     [class.mr-4]="!isCollapsed">
        </lucide-icon>
        
        <span *ngIf="!isCollapsed" class="text-sm truncate">{{ item.label }}</span>
      </a>
    </ng-container>
  </div>

  <!-- Footer Action -->
  <div class="p-4 border-t border-border/50 flex flex-col gap-2">
    <!-- New Action Button -->
    <button class="w-full h-10 bg-primary text-white rounded-btn font-semibold flex items-center justify-center hover:bg-primary-container transition-colors mb-2" [title]="isCollapsed ? 'New Action' : ''">
      <lucide-icon name="plus" [size]="18" [strokeWidth]="2.5" [ngClass]="{'mr-2': !isCollapsed}"></lucide-icon>
      <span *ngIf="!isCollapsed">New Action</span>
    </button>
    
    <!-- Help Center -->
    <a href="#" [title]="isCollapsed ? 'Help Center' : ''" class="flex items-center text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors p-2">
      <lucide-icon name="help-circle" [size]="16" class="shrink-0" [ngClass]="{'mr-3': !isCollapsed}"></lucide-icon>
      <span *ngIf="!isCollapsed">Help Center</span>
    </a>

    <!-- Logout -->
    <button (click)="logout()" [title]="isCollapsed ? 'Logout' : ''" class="flex items-center text-xs font-medium text-on-surface-variant hover:text-error transition-colors p-2 w-full text-left">
      <lucide-icon name="log-out" [size]="16" class="shrink-0" [ngClass]="{'mr-3': !isCollapsed}"></lucide-icon>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>
</div>
