<div class="max-w-[1400px] mx-auto p-8 animate-fade-in-up">
  
  <div class="mb-8 flex items-end justify-between flex-wrap gap-4">
    <div class="flex flex-col">
      <h1 class="text-3xl font-display font-bold text-on-surface tracking-tight mb-2">
        Dashboard Général
      </h1>
      <p class="text-sm text-on-surface-variant">Aperçu en temps réel des performances LIVR'AUTO.</p>
    </div>
    
    <div class="flex items-center text-xs font-medium text-on-surface-variant">
      Dernière mise à jour: Aujourd'hui, {{ currentDate | date:'HH:mm' }}
    </div>
  </div>

  <ng-container *ngIf="loading()">
    <!-- Skeleton loader for 5 KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-8">
      <div *ngFor="let i of [1,2,3,4,5]" class="h-32 bg-surface-container rounded-card animate-pulse"></div>
    </div>
  </ng-container>

  <ng-container *ngIf="stats() as data">
    <!-- Section 1: KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-8">
      <app-kpi-card title="Total Marchands" [value]="data.totalMarchands.toString()" icon="store" variation="+12%" trend="up" iconBgClass="bg-primary-container/10" iconColorClass="text-primary"></app-kpi-card>
      <app-kpi-card title="Total Livreurs" [value]="data.totalLivreurs.toString()" icon="bike" variation="+5%" trend="up" iconBgClass="bg-tertiary-container/10" iconColorClass="text-tertiary"></app-kpi-card>
      <app-kpi-card title="Total Commandes" [value]="data.totalCommandes.toString()" icon="shopping-bag" variation="+10%" trend="up" iconBgClass="bg-warning-container/30" iconColorClass="text-warning"></app-kpi-card>
      <app-kpi-card title="Total Missions" [value]="data.totalMissions.toString()" icon="map" variation="+15%" trend="up" iconBgClass="bg-secondary-container/50" iconColorClass="text-secondary"></app-kpi-card>
      <app-kpi-card title="Total Revenus" [value]="(data.totalRevenue | currency:'XOF':'symbol':'1.0-0') || '0'" icon="banknote" variation="+22%" trend="up" iconBgClass="bg-success-container/30" iconColorClass="text-success"></app-kpi-card>
    </div>

    <!-- Section 2: Main Layout (Charts & Actions) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Activité (Left 2 columns) -->
      <div class="lg:col-span-2 bg-surface-container-lowest rounded-card shadow-soft p-6 border border-border flex flex-col min-h-[400px]">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-display font-semibold text-on-surface">Activité de la plateforme</h2>
          <div class="flex space-x-1 bg-surface-container p-1 rounded-lg">
            <button class="px-3 py-1 text-xs font-medium rounded bg-surface-container-lowest text-on-surface shadow-sm">Jour</button>
            <button class="px-3 py-1 text-xs font-medium rounded text-on-surface-variant hover:text-on-surface transition-colors">Semaine</button>
            <button class="px-3 py-1 text-xs font-medium rounded text-on-surface-variant hover:text-on-surface transition-colors">Mois</button>
          </div>
        </div>
        
        <div class="flex-1 flex flex-col items-center justify-center text-on-surface-variant/50">
           <!-- Placeholder for Echarts -->
           <lucide-icon name="bar-chart-3" [size]="48" class="mb-4 opacity-50"></lucide-icon>
           <p class="text-sm">Données du graphique en cours d'intégration...</p>
        </div>
      </div>

      <!-- Right Column -->
      <div class="flex flex-col gap-6">
        
        <!-- Répartition -->
        <div class="bg-surface-container-lowest rounded-card shadow-soft p-6 border border-border">
          <h2 class="text-lg font-display font-semibold text-on-surface mb-6">Répartition Utilisateurs</h2>
          <div class="h-48 flex items-center justify-center text-on-surface-variant/50">
            <!-- Placeholder -->
            <div class="w-32 h-32 rounded-full border-8 border-primary border-t-secondary relative flex items-center justify-center">
               <div class="w-20 h-20 bg-surface-container-lowest rounded-full"></div>
            </div>
          </div>
          <div class="flex justify-center space-x-4 mt-4 text-xs font-medium text-on-surface-variant">
             <div class="flex items-center"><span class="w-3 h-3 bg-primary rounded-sm mr-2"></span>Marchands</div>
             <div class="flex items-center"><span class="w-3 h-3 bg-secondary rounded-sm mr-2"></span>Livreurs</div>
          </div>
        </div>

        <!-- Actions Rapides -->
        <div class="bg-surface-container-lowest rounded-card shadow-soft p-6 border border-border flex-1">
          <h2 class="text-lg font-display font-semibold text-on-surface mb-6">Actions Rapides</h2>
          
          <div class="grid grid-cols-2 gap-3">
            <button class="flex flex-col items-center justify-center p-3 rounded-lg border border-border hover:bg-surface-container-low transition-colors group">
              <lucide-icon name="user-plus" [size]="20" class="text-on-surface-variant group-hover:text-primary mb-2"></lucide-icon>
              <span class="text-xs font-medium text-on-surface-variant group-hover:text-on-surface text-center">Créer Marchand</span>
            </button>
            <button class="flex flex-col items-center justify-center p-3 rounded-lg border border-border hover:bg-surface-container-low transition-colors group">
              <lucide-icon name="bike" [size]="20" class="text-on-surface-variant group-hover:text-primary mb-2"></lucide-icon>
              <span class="text-xs font-medium text-on-surface-variant group-hover:text-on-surface text-center">Créer Livreur</span>
            </button>
            <button class="flex flex-col items-center justify-center p-3 rounded-lg border border-border hover:bg-surface-container-low transition-colors group">
              <lucide-icon name="shopping-bag" [size]="20" class="text-on-surface-variant group-hover:text-primary mb-2"></lucide-icon>
              <span class="text-xs font-medium text-on-surface-variant group-hover:text-on-surface text-center">Commandes</span>
            </button>
            <button class="flex flex-col items-center justify-center p-3 rounded-lg border border-border hover:bg-surface-container-low transition-colors group">
              <lucide-icon name="map" [size]="20" class="text-on-surface-variant group-hover:text-primary mb-2"></lucide-icon>
              <span class="text-xs font-medium text-on-surface-variant group-hover:text-on-surface text-center">Créer Mission</span>
            </button>
            <button class="flex flex-col items-center justify-center p-3 rounded-lg border border-border hover:bg-surface-container-low transition-colors group">
              <lucide-icon name="credit-card" [size]="20" class="text-on-surface-variant group-hover:text-primary mb-2"></lucide-icon>
              <span class="text-xs font-medium text-on-surface-variant group-hover:text-on-surface text-center">Paiements</span>
            </button>
            <button class="flex flex-col items-center justify-center p-3 rounded-lg border border-border hover:bg-surface-container-low transition-colors group">
              <lucide-icon name="download" [size]="20" class="text-on-surface-variant group-hover:text-primary mb-2"></lucide-icon>
              <span class="text-xs font-medium text-on-surface-variant group-hover:text-on-surface text-center">Export Rapport</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </ng-container>
</div>
